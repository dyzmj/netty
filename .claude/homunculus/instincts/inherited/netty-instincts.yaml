# Netty Workflow Auto Port Fix Or Feature To 4 1

## Action

Follow the auto-port-fix-or-feature-to-4-1 workflow:
1. Cherry-pick the relevant commit from the source branch.
2. Apply changes to the same files in the 4.1 branch.
3. Update or add corresponding test files if necessary.
4. Commit with a message starting with 'Auto-port 4.1:' and referencing the original PR/commit.
5. Co-author attribution if applicable.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~10x per month
- Files: */src/main/java/**/*.java, */src/main/c/**/*.c, */src/test/java/**/*.java

